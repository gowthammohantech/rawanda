# Screen tab → first patient → BP 128/82 → Review → Save. Ends on "Saved on this device".
appId: host.exp.Exponent
---
- tapOn:
    id: "tab-screen"
- tapOn:
    id: "choose-patient"
- tapOn:
    id: "patient-search-input"
- inputText: "DEMO"
- tapOn:
    id: "patient-row-.*"
    index: 0
- runFlow:
    when:
      visible:
        id: "resume-prompt"
    commands:
      - tapOn:
          id: "start-new-draft"
- tapOn:
    id: "field-systolic"
- inputText: "128"
- tapOn:
    id: "field-diastolic"
- inputText: "82"
- hideKeyboard
- tapOn:
    id: "screening-review"
- scrollUntilVisible:
    element:
      id: "review-submit"
- tapOn:
    id: "review-submit"
- assertVisible: "Saved on this device"
