# HWM-02 manual path as a device gate (not part of `pnpm verify`): run with the app signed in as
# any worker persona, all simulation toggles off. `pnpm --filter @laif/worker-mobile test:maestro`
appId: host.exp.Exponent
---
- launchApp
- tapOn:
    id: "avatar-button"
- tapOn:
    id: "open-network-simulation"
- assertVisible: "SIMULATION"
- assertVisible: "Simulated sync server (on this device)"
- tapOn: "Work offline (simulated)"
- assertVisible: "Offline (simulated)"
- stopApp
- launchApp
- tapOn:
    id: "avatar-button"
- tapOn:
    id: "open-network-simulation"
- assertVisible: "Offline (simulated)"
- tapOn: "Work offline (simulated)"
- assertVisible: "Online"
# HWM-09: the "Run one sync pass" dev button moved to the Sync tab ("Sync now").
- tapOn: "100%"
- back
- back
- tapOn:
    id: "tab-sync"
- tapOn:
    id: "sync-now"
- assertVisible: "Nothing to sync"
- tapOn:
    id: "avatar-button"
- tapOn:
    id: "open-network-simulation"
- tapOn: "Off"
