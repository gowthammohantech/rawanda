# HWM-10 regression (tech spec §8): a screening saved offline survives an app kill + relaunch and
# is still "Saved on this device" / waiting to sync.
appId: host.exp.Exponent
---
- runFlow: subflows/fresh-start.yaml
- runFlow: subflows/sign-in.yaml
- runFlow: subflows/set-offline.yaml
- runFlow: subflows/record-screening.yaml
- stopApp
- launchApp
- assertVisible:
    id: "today-screen"
- tapOn:
    id: "tab-sync"
- assertVisible:
    id: "sync-section-waiting"
- assertVisible: "Saved on this device"
